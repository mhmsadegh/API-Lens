<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>API Lens</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <strong>🔍 API Lens</strong>
    <input id="filter" placeholder="Filter by URL / method / status…" />
    <select id="type">
      <option value="">All</option>
      <option value="fetch">fetch</option>
      <option value="xhr">xhr</option>
    </select>
    <button id="export" title="Export all as JSON">⬇</button>
    <button id="clear" title="Clear">🗑</button>
  </header>
  <main>
    <ul id="list"></ul>
    <section id="detail" class="empty">Select a request to see details</section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
